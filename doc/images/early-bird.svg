<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="t d">
  <title id="t">Early bird - work in progress</title>
  <desc id="d">A small bird on a branch at sunrise, beside the words Early bird, work in progress, not stable before 1.0.0.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <clipPath id="card"><rect width="640" height="160" rx="18"/></clipPath>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#2b2b2b"/>
      <rect x="12" width="12" height="24" fill="#f5b700"/>
    </pattern>
  </defs>
  <g clip-path="url(#card)">
    <rect width="640" height="160" fill="url(#sky)"/>
    <!-- the rising sun -->
    <circle cx="96" cy="150" r="70" fill="#ffb627" opacity="0.55"/>
    <circle cx="96" cy="150" r="48" fill="#ff9f1c" opacity="0.7"/>
    <!-- the branch -->
    <path d="M14 118 C 60 108, 120 112, 182 104" stroke="#6b4423" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M150 108 l 18 -16" stroke="#6b4423" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="172" cy="88" rx="9" ry="5" fill="#5a9e3a" transform="rotate(-35 172 88)"/>
    <!-- the bird -->
    <g transform="translate(92 70)">
      <path d="M-30 18 L-48 30 L-26 26 Z" fill="#1f5f8b"/>
      <ellipse cx="0" cy="12" rx="32" ry="26" fill="#2a7ab0"/>
      <ellipse cx="6" cy="20" rx="20" ry="14" fill="#f4e3c1"/>
      <path d="M-14 6 C -2 -2, 14 8, 6 24 C -6 26, -16 18, -14 6 Z" fill="#1f5f8b"/>
      <circle cx="18" cy="-4" r="17" fill="#2a7ab0"/>
      <circle cx="23" cy="-8" r="5" fill="#ffffff"/>
      <circle cx="24.5" cy="-8" r="2.6" fill="#1b1b1b"/>
      <path d="M33 -4 L47 0 L33 4 Z" fill="#f08a00"/>
      <path d="M-6 36 l -3 12 M6 36 l 3 12" stroke="#f08a00" stroke-width="3" stroke-linecap="round"/>
      <!-- the worm it caught -->
      <path d="M46 1 c 6 4, 2 9, 8 12 s 4 8, 9 8" stroke="#d9586a" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
    <!-- the words -->
    <text x="232" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="2" fill="#2b2b2b">EARLY BIRD</text>
    <text x="234" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#6b4423">Work in progress</text>
    <text x="234" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#4a4a4a">Not stable before 1.0.0 - may change without notice</text>
    <!-- the construction tape -->
    <rect y="144" width="640" height="16" fill="url(#stripes)"/>
  </g>
  <rect x="1" y="1" width="638" height="158" rx="17" fill="none" stroke="#c98a00" stroke-width="2"/>
</svg>
