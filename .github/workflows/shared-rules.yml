# Checks the documents: AGENTS.md's shared block against its hash, no citation of an issue that goes stale, and a
# documentation chapter somebody can find their way through. Of its own because the build ignores a change to Markdown
# alone, which is exactly the change this is for, and it leases no machine.
name: Shared rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned GraalVM
        uses: ./.github/actions/pinned-jdk

      # check-shared, check-citations and check-doc-site are this repository's own, so the tests that run them
      # against it are the check: the ones tagged documents.
      - name: The documents
        run: ./mvnw -B -s settings.xml -Pdocuments test
